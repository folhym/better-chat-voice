<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT × Irodori</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <img src="icon32.png" alt="" width="28" height="28">
      <h1>ChatGPT × Irodori</h1>
    </header>
    <label for="serverUrl">Server</label>
    <input id="serverUrl" type="url" spellcheck="false" value="http://127.0.0.1:8088">
    <p class="hint">接続確認を押すとURLを保存します。</p>
    <button id="connect" type="button">接続確認</button>
    <div class="status-block">
      <span class="status-label">状態</span>
      <p id="status" role="status" aria-live="polite">● 確認中</p>
      <p id="statusDetail" class="hint"></p>
    </div>
    <label for="voiceSelect">Voice</label>
    <select id="voiceSelect">
      <option value="">Voiceを選択してください</option>
    </select>
    <button id="reloadVoices" class="secondary" type="button">Voice一覧を再読込</button>
    <label for="speedSelect">読み上げ速度</label>
    <select id="speedSelect">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1.0x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2.0x</option>
      <option value="2.5">2.5x</option>
    </select>
    <label for="autoReadSelect">自動読み上げ</label>
    <select id="autoReadSelect">
      <option value="off" selected>OFF</option>
      <option value="on">ON</option>
    </select>
  </main>
  <script src="popup.js"></script>
</body>
</html>
